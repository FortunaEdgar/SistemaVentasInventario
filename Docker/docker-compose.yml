services:
  postgres:
    image: postgres:16
    container_name: sistema-ventas-postgres
    restart: unless-stopped
    environment:
      POSTGRESS_DB: SistemaVentas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: